<!DOCTYPE html>

<title>Qayta yo'naltirilmoqda — Smart Ta'lim</title>
<script>
(function(){
  var y = window.location.pathname;
  var yangi = y.replace(/\/pages\//, "/");
  if (yangi !== y) {
    window.location.replace(yangi);
  } else {
    window.location.replace("/");
  }
})();
</script>
</head>
<body>
<p>Qayta yo'naltirilmoqda... <a href="/">Bosh sahifa</a></p>
