<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'zbekiston universitetlari | Smart Ta'lim</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7faf7;
    color: #1b1b1b;
  }

  header {
    background: #1b5e20;
    color: #fff;
    padding: 18px 16px;
    text-align: center;
  }

  header a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    opacity: 0.9;
  }

  header h1 {
    margin: 8px 0 0 0;
    font-size: 22px;
  }

  .uni-section {
    padding: 24px 16px 50px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .uni-search {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #a5d6a7;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
    box-sizing: border-box;
  }

  .uni-search:focus {
    border-color: #2e7d32;
  }

  .uni-count {
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
  }

  .uni-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .uni-card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-left: 4px solid #2e7d32;
    border-radius: 10px;
    padding: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .uni-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(46, 125, 50, 0.15);
  }

  .uni-card h3 {
    margin: 0 0 6px 0;
    font-size: 16px;
  }

  .uni-card p {
    margin: 2px 0;
    font-size: 13px;
    color: #555;
  }

  .uni-city {
    display: inline-block;
    margin-top: 8px;
    background: #e8f5e9;
    color: #1b5e20;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .empty-msg {
    text-align: center;
    color: #888;
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">← Bosh sahifa</a>
  <h1>🎓 O'zbekiston universitetlari</h1>
</header>

<section class="uni-section">
  <input type="text" id="uniSearch" class="uni-search" placeholder="Universitet nomi yoki shahar bo'yicha qidirish...">
  <div class="uni-count" id="uniCount"></div>
  <div class="uni-grid" id="uniGrid"></div>
  <div class="empty-msg" id="emptyMsg" style="display:none;">Hech narsa topilmadi</div>
</section>

    { name: "Samarqand davlat universiteti", city: "Samarqand", type: "Davlat" },
    { name: "Samarqand davlat tibbiyot universiteti", city: "Samarqand", type: "Davlat" },
    { name: "Samarqand davlat arxitektura-qurilish instituti", city: "Samarqand", type: "Davlat" },

    { name: "Andijon davlat universiteti", city: "Andijon", type: "Davlat" },

    { name: "Webster universiteti Toshkent", city: "Toshkent", type: "Xorijiy filial" },
    { name: "Sharq xalqaro universiteti", city: "Toshkent", type: "Xususiy" }
  ];

  function renderUniversities(list) {
    const grid = document.getElementById("uniGrid");
    const emptyMsg = document.getElementById("emptyMsg");
    const count = document.getElementById("uniCount");
    grid.innerHTML = "";
    count.textContent = `Jami: ${list.length} ta universitet`;
    emptyMsg.style.display = list.length === 0 ? "block" : "none";
    list.forEach(u => {
      const card = document.createElement("div");
      card.className = "uni-card";
      card.innerHTML = `
        <h3>${u.name}</h3>
        <p>Turi: ${u.type}</p>
        <span class="uni-city">📍 ${u.city}</span>
      `;
      grid.appendChild(card);
    });
  }

  renderUniversities(universities);

  document.getElementById("uniSearch").addEventListener("input", function (e) {
    const q = e.target.value.toLowerCase();
    const filtered = universities.filter(u =>
      u.name.toLowerCase().includes(q) || u.city.toLowerCase().includes(q)
    );
    renderUniversities(filtered);
  });
</script>

</body>
</html>
