<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Qur'on o'rganish</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#0E9F6E;--green-deep:#0B7A54;--mint:#EAFBF4;--mint-2:#D8F5E9;
  --white:#FFFFFF;--ink:#16241F;--muted:#5B6B65;--border:#DCEFE6;
  --radius:18px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--mint);min-height:100vh;-webkit-user-select:none;user-select:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--mint)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px 6px;background:var(--mint);position:sticky;top:0;z-index:10}
.topbar .back{width:28px;height:28px;border-radius:50%;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;text-decoration:none;color:var(--ink)}
.topbar h1{font-size:15px;font-weight:800;margin:0;flex:1;text-align:center}
main{padding:2px 12px 16px;flex:1}

.surah-header{text-align:center;background:linear-gradient(135deg,var(--green),var(--green-deep));border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;color:#fff}
.surah-header .arabic{font-size:22px;font-weight:700;font-family:'Amiri',serif}
.surah-header .name{font-size:12px;opacity:.85;font-weight:600;margin-top:2px}
.surah-header .num{font-size:10px;opacity:.6;margin-top:1px}
.surah-counter{text-align:center;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px}

.ayah-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;text-align:center;margin-bottom:8px}
.ayah-box .label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.ayah-box .text{font-size:20px;line-height:1.5;font-weight:700;color:var(--green-deep);font-family:'Amiri',serif;direction:rtl}

.slot-area{margin-bottom:8px}
.slot-area .label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.slots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;direction:rtl;min-height:38px;padding:6px 5px;background:var(--white);border:2px dashed var(--border);border-radius:var(--radius-sm);transition:border-color .2s}
.slots.flash{border-color:var(--green)}
.slot{width:36px;height:36px;border-radius:8px;background:var(--mint-2);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-family:'Amiri',serif;color:var(--green-deep);direction:rtl;transition:all .2s;cursor:pointer;position:relative}
.slot.filled{background:var(--green);color:#fff;border:2px solid var(--green);animation:pop .25s ease}
.slot .slot-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1;cursor:pointer;z-index:2;font-family:'Inter',sans-serif}
.slot.filled .slot-x{display:flex}
.slot.ok{box-shadow:0 0 0 3px #22c55e88}
.slot.err{animation:shake .35s ease;background:#fee2e2;border-color:#ef4444}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.pool-area{margin-bottom:8px}
.pool-area .label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pool{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:6px 5px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);direction:rtl}
.letter{width:36px;height:36px;border-radius:8px;background:var(--mint-2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-family:'Amiri',serif;color:var(--ink);direction:rtl;cursor:pointer;touch-action:manipulation;transition:all .15s}
.letter:active{transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.letter.used{opacity:.25;pointer-events:none;transform:scale(.85)}
.harakat{width:32px;height:32px;border-radius:8px;background:#FFF7E0;border:2px solid #F3E3AD;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-family:'Amiri',serif;color:#8A6D1D;direction:rtl;cursor:pointer;touch-action:manipulation;transition:all .15s}
.harakat:active{transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.harakat.used{opacity:.25;pointer-events:none;transform:scale(.85)}
.space-dot{width:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}

.fb{text-align:center;padding:6px;border-radius:8px;margin-bottom:6px;font-weight:700;font-size:12px;display:none}
.fb.ok{display:block;background:#dcfce7;color:#166534}
.fb.no{display:block;background:#fee2e2;color:#991b1b}

.ctrls{display:flex;gap:6px}
.btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn-g{background:var(--green);color:#fff}.btn-g:active{background:var(--green-deep)}
.btn-w{background:var(--white);border:1px solid var(--border);color:var(--ink)}.btn-w:active{background:var(--mint-2)}
.btn:disabled{opacity:.4;pointer-events:none}

.sound-btn{position:fixed;bottom:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(14,159,110,.3);cursor:pointer;z-index:20;border:none;transition:transform .15s}
.sound-btn:active{transform:scale(.9)}

.progress{display:flex;gap:4px;justify-content:center;margin-bottom:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .2s}
.dot.done{background:var(--green)}
.dot.current{background:var(--green-deep);box-shadow:0 0 0 3px rgba(14,159,110,.25)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.overlay-card{background:var(--white);border-radius:var(--radius);padding:32px 24px;text-align:center;max-width:340px;width:90%;animation:pop .3s ease}
.overlay-card .emoji{font-size:52px;margin-bottom:12px}
.overlay-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.overlay-card p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}

.select-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.select-title{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center}
.select-sub{font-size:14px;color:var(--muted);margin-bottom:28px;text-align:center}
.surah-cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}
.surah-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:24px 20px;text-align:center;cursor:pointer;transition:all .2s}
.surah-card:active{transform:scale(.97);border-color:var(--green);background:var(--mint-2)}
.surah-card .ar{font-size:32px;font-family:'Amiri',serif;font-weight:700;margin-bottom:8px}
.surah-card .nm{font-size:16px;font-weight:700;color:var(--ink)}
.surah-card .info{font-size:12px;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="select-screen" id="selectScreen">
    <div class="surah-header" style="width:100%;max-width:360px;margin-bottom:28px">
      <div class="arabic">القرآن الكريم</div>
      <div class="name">Qur'on o'rganish</div>
    </div>
    <div class="select-title">Sura tanlang</div>
    <div class="select-sub">O'rganmoqchi bo'lgan surangizni bosing</div>
    <div class="surah-cards" id="surahCards"></div>
  </div>

  <div class="hidden" id="learnScreen">
    <div class="topbar">
      <a class="back" href="#" id="backToSelect">&larr;</a>
      <h1 id="topTitle">Sura</h1>
    </div>

    <main>
    <div class="surah-header">
      <div class="arabic" id="surahArabic"></div>
      <div class="name" id="surahName"></div>
      <div class="num" id="surahNum"></div>
    </div>

    <div class="surah-counter" id="surahCounter"></div>

    <div class="progress" id="progress"></div>

    <div class="ayah-box">
      <div class="label">Oyat matni</div>
      <div class="text" id="ayahText"></div>
    </div>

    <div class="fb" id="fb"></div>

    <div class="slot-area">
      <div class="label">Harflarni bosing</div>
      <div class="slots" id="slots"></div>
    </div>

    <div class="pool-area">
      <div class="label">Harflarni bosing</div>
      <div class="pool" id="pool"></div>
    </div>

    <div class="pool-area">
      <div class="label">Harakatlarni bosing</div>
      <div class="pool" id="harakatPool"></div>
    </div>

    <div class="ctrls">
      <button class="btn btn-w" id="prevBtn">← Oldingi</button>
      <button class="btn btn-w" id="resetBtn">Qayta</button>
      <button class="btn btn-g" id="nextBtn" disabled>Keyingi oyat</button>
    </div>
  </main>
  </div>

  <button class="sound-btn hidden" id="soundBtn" title="Ovoz chalish">🔊</button>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="emoji">🎉</div>
      <h2>Tabriklaymiz!</h2>
      <p>Siz suralarni<br>mukammal o'rgandingiz!</p>
      <button class="btn btn-g" id="overlayCloseBtn" style="width:100%">Yaxshi!</button>
    </div>
  </div>
</div>

<script>
(function(){
  var SURAHS = [
    {
      name: "Al-Fotiha",
      arabic: "الفاتحة",
      num: "7-oyat",
      ayahs: [
        { text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ" },
        { text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ" },
        { text: "الرَّحْمَٰنِ الرَّحِيمِ" },
        { text: "مَالِكِ يَوْمِ الدِّينِ" },
        { text: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ" },
        { text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ" },
        { text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ" }
      ]
    },
    {
      name: "Al-Ixlos",
      arabic: "الإخلاص",
      num: "4-oyat",
      ayahs: [
        { text: "قُلْ هُوَ اللَّهُ أَحَدٌ" },
        { text: "اللَّهُ الصَّمَدُ" },
        { text: "لَمْ يَلِدْ وَلَمْ يُولَدْ" },
        { text: "وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ" }
      ]
    },
    {
      name: "Al-Falaq",
      arabic: "الفلق",
      num: "5-oyat",
      ayahs: [
        { text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ" },
        { text: "مِن شَرِّ مَا خَلَقَ" },
        { text: "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ" },
        { text: "وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ" },
        { text: "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ" }
      ]
    },
    {
      name: "An-Nas",
      arabic: "الناس",
      num: "6-oyat",
      ayahs: [
        { text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ" },
        { text: "مَلِكِ النَّاسِ" },
        { text: "إِلَٰهِ النَّاسِ" },
        { text: "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ" },
        { text: "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ" },
        { text: "مِنَ الْجِنَّةِ وَالنَّاسِ" }
      ]
    }
  ];

  var selectScreen = document.getElementById('selectScreen');
  var learnScreen = document.getElementById('learnScreen');
  var surahCards = document.getElementById('surahCards');
  var soundBtnEl = document.getElementById('soundBtn');
  var backToSelectBtn = document.getElementById('backToSelect');

  SURAHS.forEach(function(surah, idx) {
    var card = document.createElement('div');
    card.className = 'surah-card';
    card.innerHTML = '<div class="ar">' + surah.arabic + '</div>' +
                     '<div class="nm">' + surah.name + '</div>' +
                     '<div class="info">' + surah.num + '</div>';
    card.addEventListener('click', function() {
      selectScreen.classList.add('hidden');
      learnScreen.classList.remove('hidden');
      soundBtnEl.classList.remove('hidden');
      startSurah(idx);
    });
    surahCards.appendChild(card);
  });

  backToSelectBtn.addEventListener('click', function(e) {
    e.preventDefault();
    learnScreen.classList.add('hidden');
    soundBtnEl.classList.add('hidden');
    selectScreen.classList.remove('hidden');
  });

  function startSurah(idx) {
    surahIdx = idx;
    ayahIdx = 0;
    render();
  }

  var isHarakat = function(code) {
    return (code >= 0x0610 && code <= 0x061A) ||
           (code >= 0x064B && code <= 0x065F) ||
           code === 0x0670 ||
           (code >= 0x06D6 && code <= 0x06ED);
  };

  function tokenize(text) {
    var tokens = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (c === ' ') { tokens.push(' '); continue; }
      var code = c.codePointAt(0);
      if (isHarakat(code) && tokens.length > 0 && tokens[tokens.length - 1] !== ' ') {
        tokens[tokens.length - 1].diac += c;
      } else {
        tokens.push({ base: c, diac: '' });
      }
    }
    return tokens;
  }

  for (var s = 0; s < SURAHS.length; s++) {
    var ayahsList = SURAHS[s].ayahs;
    for (var a = 0; a < ayahsList.length; a++) {
      ayahsList[a].tokens = tokenize(ayahsList[a].text);
    }
  }

  var DOTTED = '\u25CC';

  function applyWaqf(text) {
    var t = text.replace(/\s+$/, '');
    var last = t.charAt(t.length - 1);
    var SHORT_VOWELS = ['\u064B','\u064C','\u064D','\u064E','\u064F','\u0650'];
    if (SHORT_VOWELS.indexOf(last) !== -1) {
      t = t.slice(0, -1);
    }
    return t;
  }

  var surahIdx = 0;
  var ayahIdx = 0;
  var placedLetter = [];
  var placedHarakat = [];
  var soundOn = true;
  var synth = window.speechSynthesis || null;

  var slotsEl = document.getElementById('slots');
  var poolEl = document.getElementById('pool');
  var harakatPoolEl = document.getElementById('harakatPool');
  var fbEl = document.getElementById('fb');
  var ayahTextEl = document.getElementById('ayahText');
  var progressEl = document.getElementById('progress');
  var topTitleEl = document.getElementById('topTitle');
  var surahArabicEl = document.getElementById('surahArabic');
  var surahNameEl = document.getElementById('surahName');
  var surahNumEl = document.getElementById('surahNum');
  var surahCounterEl = document.getElementById('surahCounter');
  var nextBtn = document.getElementById('nextBtn');
  var prevBtn = document.getElementById('prevBtn');
  var resetBtn = document.getElementById('resetBtn');
  var soundBtn = document.getElementById('soundBtn');
  var overlayEl = document.getElementById('overlay');
  var overlayCloseBtn = document.getElementById('overlayCloseBtn');

  function speak(txt) {
    if (!soundOn || !synth || !txt || !txt.trim()) return;
    try {
      synth.cancel();
      setTimeout(function() {
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = 'ar-SA';
        u.rate = 0.7;
        u.pitch = 1;
        var voices = synth.getVoices();
        var arVoice = null;
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang && voices[i].lang.indexOf('ar') === 0) {
            arVoice = voices[i];
            break;
          }
        }
        if (arVoice) u.voice = arVoice;
        synth.speak(u);
      }, 50);
    } catch(e) {}
  }

  // Faqat harf-tokenlar (bo'shliqsiz) ro'yxati — bitta katak = bitta shu ro'yxatdagi element
  function letterTokens(ayah) {
    var result = [];
    for (var i = 0; i < ayah.tokens.length; i++) {
      if (ayah.tokens[i] !== ' ') result.push(ayah.tokens[i]);
    }
    return result;
  }

  function currentSurah() {
    return SURAHS[surahIdx];
  }

  function currentAyah() {
    return currentSurah().ayahs[ayahIdx];
  }

  function renderProgress() {
    var ayahs = currentSurah().ayahs;
    var html = '';
    for (var i = 0; i < ayahs.length; i++) {
      var cls = 'dot';
      if (i < ayahIdx) cls += ' done';
      else if (i === ayahIdx) cls += ' current';
      html += '<div class="' + cls + '" data-i="' + i + '"></div>';
    }
    progressEl.innerHTML = html;
    var dots = progressEl.children;
    for (var j = 0; j < dots.length; j++) {
      if (j <= ayahIdx) {
        dots[j].style.cursor = 'pointer';
        dots[j].addEventListener('click', function(i) { return function() { goToAyah(i); }; }(j));
      }
    }
  }

  function goToAyah(i) {
    if (i === ayahIdx) return;
    ayahIdx = i;
    render();
  }

  function render() {
    var surah = currentSurah();
    var ayah = currentAyah();
    var tokens = letterTokens(ayah);
    placedLetter = [];
    placedHarakat = [];
    for (var i = 0; i < tokens.length; i++) { placedLetter.push(null); placedHarakat.push(null); }

    topTitleEl.textContent = surah.name;
    surahArabicEl.textContent = surah.arabic;
    surahNameEl.textContent = surah.name + ' surasi';
    surahNumEl.textContent = surah.num;
    surahCounterEl.textContent = (surahIdx + 1) + ' / ' + SURAHS.length + '-sura';

    ayahTextEl.textContent = ayah.text;
    fbEl.className = 'fb';
    fbEl.textContent = '';
    nextBtn.disabled = true;
    prevBtn.disabled = (surahIdx === 0 && ayahIdx === 0);

    var isLastAyahOfSurah = (ayahIdx === surah.ayahs.length - 1);
    var isLastSurah = (surahIdx === SURAHS.length - 1);
    nextBtn.textContent = (isLastAyahOfSurah && !isLastSurah) ? "Keyingi sura →" : 'Keyingi oyat';

    renderProgress();
    renderSlots(tokens.length);
    renderLetterPool(ayah.tokens);
    renderHarakatPool(ayah.tokens);
  }

  function renderSlots(n) {
    slotsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('div');
      s.className = 'slot';
      s.setAttribute('data-i', i);
      s.addEventListener('click', createSlotClick(i));
      slotsEl.appendChild(s);
    }
  }

  function createSlotClick(idx) {
    return function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('slot-x')) {
        e.stopPropagation();
        removeSlot(idx);
        return;
      }
      var txt = currentSlotText(idx);
      if (txt) speak(txt);
    };
  }

  function renderLetterPool(tokens) {
    poolEl.innerHTML = '';
    var idx = 0;
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i] === ' ') {
        var d = document.createElement('div');
        d.className = 'space-dot';
        d.textContent = '\u00B7';
        poolEl.appendChild(d);
        continue;
      }
      var t = document.createElement('div');
      t.className = 'letter';
      t.textContent = tokens[i].base;
      t.setAttribute('data-idx', idx);
      t.addEventListener('click', function(tile) { return function() { placeBaseLetter(tile); }; }(t));
      poolEl.appendChild(t);
      idx++;
    }
  }

  function renderHarakatPool(tokens) {
    harakatPoolEl.innerHTML = '';
    var idx = 0;
    var any = false;
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i] === ' ') { idx += 0; continue; }
      if (tokens[i].diac) {
        var h = document.createElement('div');
        h.className = 'harakat';
        h.textContent = DOTTED + tokens[i].diac;
        h.setAttribute('data-idx', idx);
        h.addEventListener('click', function(tile) { return function() { placeHarakat(tile); }; }(h));
        harakatPoolEl.appendChild(h);
        any = true;
      }
      idx++;
    }
    harakatPoolEl.parentElement.style.display = any ? '' : 'none';
  }

  function currentSlotText(idx) {
    var base = placedLetter[idx] || (placedHarakat[idx] ? DOTTED : '');
    return base + (placedHarakat[idx] || '');
  }

  function getSlotsText() {
    var ayah = currentAyah();
    var tokens = ayah.tokens;
    var result = '';
    var idx = 0;
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i] === ' ') { result += ' '; continue; }
      result += currentSlotText(idx);
      idx++;
    }
    return result;
  }

  function updateSlotDisplay(idx) {
    var slot = slotsEl.children[idx];
    var txt = currentSlotText(idx);
    if (!txt) {
      slot.innerHTML = '';
      slot.classList.remove('filled');
      return;
    }
    slot.innerHTML = txt + '<span class="slot-x">\u2715</span>';
    slot.classList.add('filled');
  }

  function placeBaseLetter(tile) {
    if (tile.classList.contains('used')) return;
    var idx = parseInt(tile.getAttribute('data-idx'), 10);
    if (placedLetter[idx]) return;

    var ayah = currentAyah();
    var token = letterTokens(ayah)[idx];
    placedLetter[idx] = token.base;
    tile.classList.add('used');

    updateSlotDisplay(idx);
    flashSlots();
    speak(token.base);
    checkAllDone();
  }

  function placeHarakat(tile) {
    if (tile.classList.contains('used')) return;
    var idx = parseInt(tile.getAttribute('data-idx'), 10);
    if (placedHarakat[idx]) return;

    var ayah = currentAyah();
    var token = letterTokens(ayah)[idx];
    placedHarakat[idx] = token.diac;
    tile.classList.add('used');

    updateSlotDisplay(idx);
    flashSlots();
    // harf allaqachon joylangan bo'lsa — to'liq to'g'ri ovozi (masalan "qu") eshittiramiz
    speak((placedLetter[idx] || '') + token.diac);
    checkAllDone();
  }

  function flashSlots() {
    slotsEl.classList.add('flash');
    setTimeout(function() { slotsEl.classList.remove('flash'); }, 250);
  }

  function checkAllDone() {
    var ayah = currentAyah();
    var tokens = letterTokens(ayah);
    for (var i = 0; i < tokens.length; i++) {
      if (!placedLetter[i]) return;
      if (tokens[i].diac && !placedHarakat[i]) return;
    }
    setTimeout(finishAyah, 400);
  }

  function finishAyah() {
    var slots = slotsEl.children;
    for (var i = 0; i < slots.length; i++) slots[i].classList.add('ok');
    var ayah = currentAyah();
    fbEl.className = 'fb ok';
    fbEl.textContent = 'Mukammal! To\'g\'ri!';
    nextBtn.disabled = false;
    speak(applyWaqf(ayah.text));
  }

  function removeSlot(idx) {
    if (!placedLetter[idx] && !placedHarakat[idx]) return;
    placedLetter[idx] = null;
    placedHarakat[idx] = null;
    updateSlotDisplay(idx);
    slotsEl.children[idx].classList.remove('ok', 'err');

    var letterTiles = poolEl.children;
    for (var i = 0; i < letterTiles.length; i++) {
      if (letterTiles[i].classList.contains('letter') &&
          parseInt(letterTiles[i].getAttribute('data-idx'), 10) === idx) {
        letterTiles[i].classList.remove('used');
        break;
      }
    }
    var harakatTiles = harakatPoolEl.children;
    for (var j = 0; j < harakatTiles.length; j++) {
      if (harakatTiles[j].classList.contains('harakat') &&
          parseInt(harakatTiles[j].getAttribute('data-idx'), 10) === idx) {
        harakatTiles[j].classList.remove('used');
        break;
      }
    }
  }

  function reset() { render(); }

  function nextAyah() {
    var surah = currentSurah();
    if (ayahIdx < surah.ayahs.length - 1) {
      ayahIdx++;
      render();
    } else if (surahIdx < SURAHS.length - 1) {
      surahIdx++;
      ayahIdx = 0;
      render();
    } else {
      overlayEl.classList.add('show');
    }
  }

  function closeOverlay() {
    overlayEl.classList.remove('show');
    learnScreen.classList.add('hidden');
    soundBtnEl.classList.add('hidden');
    selectScreen.classList.remove('hidden');
  }

  function prevAyah() {
    if (ayahIdx > 0) {
      ayahIdx--;
      render();
    } else if (surahIdx > 0) {
      surahIdx--;
      ayahIdx = SURAHS[surahIdx].ayahs.length - 1;
      render();
    } else {
      learnScreen.classList.add('hidden');
      soundBtnEl.classList.add('hidden');
      selectScreen.classList.remove('hidden');
    }
  }

  resetBtn.addEventListener('click', reset);
  prevBtn.addEventListener('click', prevAyah);
  nextBtn.addEventListener('click', nextAyah);
  soundBtn.addEventListener('click', function() {
    var txt = getSlotsText().trim();
    if (txt) speak(applyWaqf(txt));
  });
  overlayCloseBtn.addEventListener('click', closeOverlay);

  if (synth) {
    synth.onvoiceschanged = function() { synth.getVoices(); };
  }
})();
</script>
</body>
</html>
