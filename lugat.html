<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lug'atlar — Smart Ta'lim</title>
<style>
  :root{
    --main-green:#1fa363;
    --light-green:#e8f8f0;
    --dark-text:#1c2b25;
    --gray-text:#6b7a73;
    --border:#dfece6;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
  body{background:var(--light-green);color:var(--dark-text);padding-bottom:80px;}

  .topbar{
    background:var(--main-green);color:var(--white);
    padding:16px 18px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .topbar h1{font-size:20px;font-weight:600;margin-bottom:10px;}

  .tabs{display:flex;gap:8px;margin-bottom:10px;}
  .tab-btn{
    flex:1;padding:8px 6px;border:none;border-radius:8px;
    background:rgba(255,255,255,.18);color:var(--white);
    font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
  }
  .tab-btn.active{background:var(--white);color:var(--main-green);}

  .section-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .section-btn{
    flex:1;padding:10px 8px;border:2px solid var(--border);border-radius:10px;
    background:var(--white);color:var(--gray-text);
    font-size:13px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .section-btn.active{background:var(--main-green);border-color:var(--main-green);color:var(--white);}
  .section-btn small{display:block;font-size:11px;font-weight:400;opacity:.8;}

  .search-box{
    display:flex;align-items:center;background:var(--white);
    border-radius:10px;padding:8px 12px;gap:8px;
  }
  .search-box input{
    border:none;outline:none;flex:1;font-size:14px;color:var(--dark-text);background:transparent;
  }
  .search-box svg{flex-shrink:0;}

  .count-info{
    padding:10px 18px 4px;font-size:12px;color:var(--gray-text);
  }

  .list{padding:8px 14px;display:flex;flex-direction:column;gap:8px;}

  .item-card{
    background:var(--white);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:.15s;
  }
  .item-card:active{transform:scale(0.98);background:var(--light-green);}

  .word-block{display:flex;flex-direction:column;gap:2px;}
  .word-main{font-size:15px;font-weight:600;color:var(--dark-text);}
  .word-sub{font-size:13px;color:var(--gray-text);}

  .speak-btn{
    width:36px;height:36px;border-radius:50%;
    background:var(--light-green);border:none;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--main-green);cursor:pointer;
  }
  .speak-btn.playing{background:var(--main-green);color:var(--white);}

  .empty-state{
    text-align:center;color:var(--gray-text);font-size:14px;padding:40px 20px;
  }

  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:var(--white);
    border-top:1px solid var(--border);display:flex;
    justify-content:space-around;padding:8px 0;box-shadow:0 -2px 6px rgba(0,0,0,.05);
  }
  .nav-item{font-size:11px;color:var(--gray-text);text-align:center;}
  .nav-item.active{color:var(--main-green);font-weight:600;}
</style>
</head>
<body>

<div class="topbar">
  <h1>📖 Lug'atlar</h1>
  <div class="section-tabs">
    <button class="section-btn active" data-section="oson" id="secOson">
      1-qism
      <small>Boshlang'ich lug'at</small>
    </button>
    <button class="section-btn" data-section="qiyin" id="secQiyin">
      2-qism
      <small>Keyingi lug'at</small>
    </button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-dir="en-uz" id="tabEnUz">Ingliz → O'zbek</button>
    <button class="tab-btn" data-dir="uz-en" id="tabUzEn">O'zbek → Ingliz</button>
  </div>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7a73" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="So'z qidirish...">
  </div>
</div>

<div class="count-info" id="countInfo"></div>
<div class="list" id="wordList"></div>

<div class="bottom-nav">
  <div class="nav-item">🏠<br>Bosh sahifa</div>
  <div class="nav-item active">📖<br>Lug'atlar</div>
  <div class="nav-item">🎓<br>Universitetlar</div>
  <div class="nav-item">👤<br>Profil</div>
  <div class="nav-item">📨<br>Murojaatlar</div>
</div>

<script src="lugat_oson_data.js"></script>
<script src="lugat_qiyin_data.js"></script>
<script>
const LUGAT_BOLIMLAR = {
  oson: typeof LUGAT_OSON !== 'undefined' ? LUGAT_OSON : [],
  qiyin: typeof LUGAT_QIYIN !== 'undefined' ? LUGAT_QIYIN : []
};

let currentSection = "oson";
let currentDir = "en-uz";
const listEl = document.getElementById("wordList");
const countEl = document.getElementById("countInfo");
const searchInput = document.getElementById("searchInput");

function getWords(){ return LUGAT_BOLIMLAR[currentSection] || []; }

function render(filter=""){
  listEl.innerHTML = "";
  const f = filter.trim().toLowerCase();
  let shown = 0;

  const rows = [];
  getWords().forEach(([en, uz], idx) => {
    const main = currentDir === "en-uz" ? en : uz;
    const sub  = currentDir === "en-uz" ? uz : en;
    if (f && !main.toLowerCase().includes(f) && !sub.toLowerCase().includes(f)) return;

    shown++;
    rows.push(`
      <div class="item-card" data-i="${idx}">
        <div class="word-block">
          <div class="word-main">${main}</div>
          <div class="word-sub">${sub}</div>
        </div>
        <button class="speak-btn" aria-label="Tinglash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        </button>
      </div>
    `);
  });
  listEl.innerHTML = rows.join("");
  listEl.querySelectorAll(".item-card").forEach((card) => {
    const idx = +card.getAttribute("data-i");
    const [en, uz] = getWords()[idx];
    const main = currentDir === "en-uz" ? en : uz;
    const btn = card.querySelector(".speak-btn");
    const speakFn = () => speak(main, currentDir === "en-uz" ? "en-US" : "uz-UZ", btn);
    btn.addEventListener("click", (e)=>{ e.stopPropagation(); speakFn(); });
    card.addEventListener("click", speakFn);
  });

  const bolimNomi = currentSection === "oson" ? "1-qism" : "2-qism";
  countEl.textContent = shown ? `${bolimNomi} · ${getWords().length} ta so'z` : "";
  if (shown === 0){
    listEl.innerHTML = `<div class="empty-state">Hech narsa topilmadi 🔍</div>`;
  }
}

function speak(text, lang, btn){
  if (!('speechSynthesis' in window)){
    alert("Kechirasiz, bu qurilmada ovoz chiqarish funksiyasi ishlamaydi.");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9;

  if (btn){
    btn.classList.add("playing");
    utter.onend = () => btn.classList.remove("playing");
    utter.onerror = () => btn.classList.remove("playing");
  }
  window.speechSynthesis.speak(utter);
}

document.getElementById("tabEnUz").addEventListener("click", ()=>{
  currentDir = "en-uz";
  document.getElementById("tabEnUz").classList.add("active");
  document.getElementById("tabUzEn").classList.remove("active");
  render(searchInput.value);
});
document.getElementById("tabUzEn").addEventListener("click", ()=>{
  currentDir = "uz-en";
  document.getElementById("tabUzEn").classList.add("active");
  document.getElementById("tabEnUz").classList.remove("active");
  render(searchInput.value);
});
function setSection(sec){
  currentSection = sec;
  document.getElementById("secOson").classList.toggle("active", sec === "oson");
  document.getElementById("secQiyin").classList.toggle("active", sec === "qiyin");
  render(searchInput.value);
}
document.getElementById("secOson").addEventListener("click", ()=> setSection("oson"));
document.getElementById("secQiyin").addEventListener("click", ()=> setSection("qiyin"));
searchInput.addEventListener("input", (e)=> render(e.target.value));

render();
</script>
</body>
</html>
