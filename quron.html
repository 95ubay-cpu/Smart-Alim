<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Qur'on o'rganish — Al-Ixlos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#0E9F6E;--green-deep:#0B7A54;--mint:#EAFBF4;--mint-2:#D8F5E9;
  --white:#FFFFFF;--ink:#16241F;--muted:#5B6B65;--border:#DCEFE6;
  --radius:18px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--mint);min-height:100vh;-webkit-user-select:none;user-select:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--mint)}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;background:var(--mint);position:sticky;top:0;z-index:10}
.topbar .back{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;text-decoration:none;color:var(--ink)}
.topbar h1{font-size:19px;font-weight:800;margin:0;flex:1;text-align:center}
main{padding:4px 20px 40px;flex:1}

.surah-header{text-align:center;background:linear-gradient(135deg,var(--green),var(--green-deep));border-radius:var(--radius);padding:24px 20px;margin-bottom:16px;color:#fff}
.surah-header .arabic{font-size:34px;font-weight:700;font-family:'Amiri',serif}
.surah-header .name{font-size:16px;opacity:.85;font-weight:600;margin-top:4px}
.surah-header .num{font-size:12px;opacity:.6;margin-top:4px}

.progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .2s}
.dot.done{background:var(--green)}
.dot.current{background:var(--green-deep);box-shadow:0 0 0 3px rgba(14,159,110,.25)}

.ayah-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;margin-bottom:16px}
.ayah-box .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.ayah-letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl}
.ayah-l{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;background:var(--green);color:#fff;font-size:20px;font-weight:700;font-family:'Amiri',serif;cursor:pointer;touch-action:manipulation;transition:all .15s;direction:rtl}
.ayah-l:active{transform:scale(1.1)}
.ayah-l.used{opacity:.2;pointer-events:none;transform:scale(.8)}
.ayah-space{width:10px}

.target-box{background:var(--white);border:2px dashed var(--border);border-radius:var(--radius);padding:14px 10px;margin-bottom:16px;min-height:64px;transition:border-color .2s}
.target-box.flash{border-color:var(--green)}
.target-box .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;text-align:center}
.target-slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl}
.t-slot{width:42px;height:42px;border-radius:10px;background:var(--mint-2);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;font-family:'Amiri',serif;color:var(--green-deep);direction:rtl;transition:all .2s;position:relative}
.t-slot.filled{background:var(--green);color:#fff;border:2px solid var(--green);animation:pop .25s ease}
.t-slot.ok{box-shadow:0 0 0 3px #22c55e88}
.t-slot.err{animation:shake .35s ease;background:#fee2e2;border-color:#ef4444}
.t-slot .x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2;font-family:'Inter',sans-serif}
.t-slot.filled .x{display:flex}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.fb{text-align:center;padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-weight:700;font-size:14px;display:none}
.fb.ok{display:block;background:#dcfce7;color:#166534}
.fb.no{display:block;background:#fee2e2;color:#991b1b}

.ctrls{display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer}
.btn-g{background:var(--green);color:#fff}.btn-g:active{background:var(--green-deep)}
.btn-w{background:var(--white);border:1px solid var(--border);color:var(--ink)}.btn-w:active{background:var(--mint-2)}
.btn:disabled{opacity:.4;pointer-events:none}

.sound-btn{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(14,159,110,.3);cursor:pointer;z-index:20;border:none;transition:transform .15s}
.sound-btn:active{transform:scale(.9)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.overlay-card{background:var(--white);border-radius:var(--radius);padding:32px 24px;text-align:center;max-width:340px;width:90%;animation:pop .3s ease}
.overlay-card .emoji{font-size:52px;margin-bottom:12px}
.overlay-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.overlay-card p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">&larr;</a>
    <h1>Al-Ixlos</h1>
  </div>

  <main>
    <div class="surah-header">
      <div class="arabic">الإخلاص</div>
      <div class="name">Al-Ixlos surasi</div>
      <div class="num">112-oyat</div>
    </div>

    <div class="progress" id="progress"></div>

    <div class="ayah-box">
      <div class="label">Oyat — harflarni bosing</div>
      <div class="ayah-letters" id="ayahLetters"></div>
    </div>

    <div class="fb" id="fb"></div>

    <div class="target-box" id="targetBox">
      <div class="label">Joylangan harflar</div>
      <div class="target-slots" id="targetSlots"></div>
    </div>

    <div class="ctrls">
      <button class="btn btn-w" id="resetBtn">Qayta</button>
      <button class="btn btn-g" id="nextBtn" disabled>Keyingi oyat</button>
    </div>
  </main>

  <button class="sound-btn" id="soundBtn" title="Ovoz chalish">🔊</button>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="emoji">🎉</div>
      <h2>Tabriklaymiz!</h2>
      <p>Siz Al-Ixlos surasini<br>mukammal o'rgandingiz!</p>
      <button class="btn btn-g" id="overlayCloseBtn" style="width:100%">Yaxshi!</button>
    </div>
  </div>
</div>

<script>
(function(){
  var AYAHS = [
    { text: "\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C",
      letters: ["\u0642","\u0644"," ","\u0647","\u0648"," ","\u0627","\u0644","\u0644","\u0647"," ","\u0623","\u062D","\u062F"] },
    { text: "\u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0627\u0644\u0652\u0635\u0650\u064E\u0645\u064E\u062F\u064F",
      letters: ["\u0627","\u0644","\u0644","\u0647"," ","\u0627","\u0644","\u0635","\u0645","\u062F"] },
    { text: "\u0644\u064E\u0645\u0652 \u064A\u064E\u0644\u0650\u062F\u0652 \u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064F\u0648\u064E\u0644\u064E\u062F\u0652",
      letters: ["\u0644","\u0645"," ","\u064A","\u0644","\u062F"," ","\u0648","\u0644","\u0645"," ","\u064A","\u0648","\u0644","\u062F"] },
    { text: "\u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064E\u0643\u064F\u0646\u0652 \u0644\u0651\u064E\u0647\u064F \u0643\u064F\u0641\u064F\u0648\u064E\u064B \u0623\u064E\u062D\u064E\u062F\u064C",
      letters: ["\u0648","\u0644","\u0645"," ","\u064A","\u0643","\u0646"," ","\u0644","\u0647"," ","\u0643","\u0641","\u0648","\u0647"," ","\u0623","\u062D","\u062F"] }
  ];

  var ayahIdx = 0;
  var placed = [];
  var srcUsed = [];
  var synth = window.speechSynthesis || null;

  var ayahLettersEl = document.getElementById('ayahLetters');
  var targetSlotsEl = document.getElementById('targetSlots');
  var targetBoxEl = document.getElementById('targetBox');
  var fbEl = document.getElementById('fb');
  var progressEl = document.getElementById('progress');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');
  var soundBtn = document.getElementById('soundBtn');
  var overlayEl = document.getElementById('overlay');
  var overlayCloseBtn = document.getElementById('overlayCloseBtn');

  function speak(txt) {
    if (!synth || !txt || !txt.trim()) return;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ar-SA';
      u.rate = 0.7;
      u.pitch = 1;
      var voices = synth.getVoices();
      var arVoice = null;
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.indexOf('ar') === 0) {
          arVoice = voices[i];
          break;
        }
      }
      if (arVoice) u.voice = arVoice;
      synth.speak(u);
    } catch(e) {}
  }

  function getClean(ayah) {
    var r = [];
    for (var i = 0; i < ayah.letters.length; i++) {
      if (ayah.letters[i] !== ' ') r.push(ayah.letters[i]);
    }
    return r;
  }

  function renderProgress() {
    var html = '';
    for (var i = 0; i < AYAHS.length; i++) {
      var cls = 'dot';
      if (i < ayahIdx) cls += ' done';
      else if (i === ayahIdx) cls += ' current';
      html += '<div class="' + cls + '"></div>';
    }
    progressEl.innerHTML = html;
  }

  function render() {
    var ayah = AYAHS[ayahIdx];
    var letters = getClean(ayah);
    placed = [];
    srcUsed = [];
    for (var i = 0; i < letters.length; i++) {
      placed.push(null);
      srcUsed.push(false);
    }

    fbEl.className = 'fb';
    fbEl.textContent = '';
    nextBtn.disabled = true;

    renderProgress();
    renderAyahLetters(ayah.letters);
    renderTargetSlots(letters.length);
  }

  function renderAyahLetters(letters) {
    ayahLettersEl.innerHTML = '';
    var li = 0;
    for (var i = 0; i < letters.length; i++) {
      if (letters[i] === ' ') {
        var sp = document.createElement('div');
        sp.className = 'ayah-space';
        sp.setAttribute('data-li', li);
        ayahLettersEl.appendChild(sp);
        li++;
        continue;
      }
      var el = document.createElement('div');
      el.className = 'ayah-l';
      el.textContent = letters[i];
      el.setAttribute('data-li', li);
      el.setAttribute('data-ch', letters[i]);
      el.addEventListener('click', createLetterClick(el, li, letters[i]));
      ayahLettersEl.appendChild(el);
      li++;
    }
  }

  function createLetterClick(el, idx, ch) {
    return function() {
      if (srcUsed[idx]) return;

      var slots = targetSlotsEl.children;
      var emptySlot = null;
      var emptyIdx = -1;
      for (var i = 0; i < slots.length; i++) {
        if (!slots[i].classList.contains('filled')) {
          emptySlot = slots[i];
          emptyIdx = i;
          break;
        }
      }
      if (!emptySlot) return;

      srcUsed[idx] = true;
      placed[emptyIdx] = ch;

      el.classList.add('used');
      emptySlot.innerHTML = ch + '<span class="x">\u2715</span>';
      emptySlot.classList.add('filled');

      targetBoxEl.classList.add('flash');
      setTimeout(function() { targetBoxEl.classList.remove('flash'); }, 250);

      speak(ch);

      var filledCount = 0;
      var allPlaced = '';
      for (var j = 0; j < placed.length; j++) {
        if (placed[j]) {
          filledCount++;
          allPlaced += placed[j];
        }
      }

      if (filledCount > 1) {
        setTimeout(function() { speak(allPlaced); }, 800);
      }

      if (filledCount === placed.length) {
        setTimeout(checkAnswer, 600);
      }
    };
  }

  function renderTargetSlots(n) {
    targetSlotsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('div');
      s.className = 't-slot';
      s.setAttribute('data-i', i);
      s.addEventListener('click', createSlotClick(i));
      targetSlotsEl.appendChild(s);
    }
  }

  function createSlotClick(idx) {
    return function(e) {
      if (e.target.classList.contains('x')) {
        removeSlot(idx);
      } else if (placed[idx]) {
        speak(placed[idx]);
      }
    };
  }

  function removeSlot(idx) {
    if (!placed[idx]) return;
    var ch = placed[idx];
    placed[idx] = null;

    var slots = targetSlotsEl.children;
    slots[idx].innerHTML = '';
    slots[idx].classList.remove('filled', 'ok', 'err');

    var ayahItems = ayahLettersEl.children;
    for (var i = 0; i < ayahItems.length; i++) {
      var item = ayahItems[i];
      if (item.getAttribute('data-li') !== null &&
          parseInt(item.getAttribute('data-li')) === findFirstUnused(ch)) {
        item.classList.remove('used');
        srcUsed[parseInt(item.getAttribute('data-li'))] = false;
        break;
      }
    }
  }

  function findFirstUnused(ch) {
    for (var i = 0; i < srcUsed.length; i++) {
      if (!srcUsed[i]) {
        var ayah = AYAHS[ayahIdx];
        var li = 0;
        for (var j = 0; j < ayah.letters.length; j++) {
          if (ayah.letters[j] !== ' ') {
            if (li === i && ayah.letters[j] === ch) return i;
            li++;
          }
        }
      }
    }
    return -1;
  }

  function checkAnswer() {
    var ayah = AYAHS[ayahIdx];
    var correct = getClean(ayah);
    var slots = targetSlotsEl.children;
    var allOk = true;

    for (var i = 0; i < correct.length; i++) {
      if (placed[i] === correct[i]) {
        slots[i].classList.add('ok');
      } else {
        slots[i].classList.add('err');
        allOk = false;
      }
    }

    if (allOk) {
      fbEl.className = 'fb ok';
      fbEl.textContent = 'Mukammal! To\'g\'ri!';
      nextBtn.disabled = false;
      speak(ayah.text);
    } else {
      fbEl.className = 'fb no';
      fbEl.textContent = 'Xato bor — qaytadan urinib ko\'ring!';
    }
  }

  function reset() { render(); }

  function nextAyah() {
    if (ayahIdx < AYAHS.length - 1) {
      ayahIdx++;
      render();
    } else {
      overlayEl.classList.add('show');
    }
  }

  function closeOverlay() {
    overlayEl.classList.remove('show');
    ayahIdx = 0;
    render();
  }

  resetBtn.addEventListener('click', reset);
  nextBtn.addEventListener('click', nextAyah);
  soundBtn.addEventListener('click', function() {
    var text = '';
    for (var i = 0; i < placed.length; i++) {
      if (placed[i]) text += placed[i];
    }
    if (text) speak(text);
  });
  overlayCloseBtn.addEventListener('click', closeOverlay);

  if (synth) {
    synth.onvoiceschanged = function() { synth.getVoices(); };
  }

  render();
})();
</script>
</body>
</html>
