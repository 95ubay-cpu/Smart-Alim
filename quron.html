<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Qur'on o'rganish — Al-Ixlos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap');

:root{
  --green:#0E9F6E;--green-deep:#0B7A54;--mint:#EAFBF4;--mint-2:#D8F5E9;
  --white:#FFFFFF;--ink:#16241F;--muted:#5B6B65;--border:#DCEFE6;
  --radius:18px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--mint);min-height:100vh;-webkit-user-select:none;user-select:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--mint)}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;background:var(--mint);position:sticky;top:0;z-index:10}
.topbar .back{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;text-decoration:none;color:var(--ink)}
.topbar h1{font-size:19px;font-weight:800;margin:0;flex:1;text-align:center}
main{padding:4px 20px 40px;flex:1}

.surah-header{text-align:center;background:linear-gradient(135deg,var(--green),var(--green-deep));border-radius:var(--radius);padding:24px 20px;margin-bottom:20px;color:#fff}
.surah-header .arabic{font-size:34px;font-weight:700;font-family:'Amiri',serif}
.surah-header .name{font-size:16px;opacity:.85;font-weight:600;margin-top:4px}
.surah-header .num{font-size:12px;opacity:.6;margin-top:4px}

.ayah-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;margin-bottom:20px}
.ayah-box .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.ayah-box .text{font-size:28px;line-height:1.8;font-weight:700;color:var(--green-deep);font-family:'Amiri',serif;direction:rtl}

.slot-area{margin-bottom:20px}
.slot-area .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;direction:rtl;min-height:60px;padding:12px 8px;background:var(--white);border:2px dashed var(--border);border-radius:var(--radius);transition:border-color .2s}
.slots.flash{border-color:var(--green)}
.slot{width:48px;height:48px;border-radius:12px;background:var(--mint-2);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-family:'Amiri',serif;color:var(--green-deep);direction:rtl;transition:all .2s;cursor:pointer;position:relative}
.slot.filled{background:var(--green);color:#fff;border:2px solid var(--green);animation:pop .25s ease}
.slot .slot-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1;cursor:pointer;z-index:2;font-family:'Inter',sans-serif}
.slot.filled .slot-x{display:flex}
.slot.ok{box-shadow:0 0 0 3px #22c55e88}
.slot.err{animation:shake .35s ease;background:#fee2e2;border-color:#ef4444}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.pool-area{margin-bottom:20px}
.pool-area .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 8px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius)}
.letter{width:48px;height:48px;border-radius:12px;background:var(--mint-2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-family:'Amiri',serif;color:var(--ink);direction:rtl;cursor:pointer;touch-action:manipulation;transition:all .15s}
.letter:active{transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.letter.used{opacity:.25;pointer-events:none;transform:scale(.85)}
.space-dot{width:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}

.fb{text-align:center;padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-weight:700;font-size:14px;display:none}
.fb.ok{display:block;background:#dcfce7;color:#166534}
.fb.no{display:block;background:#fee2e2;color:#991b1b}

.ctrls{display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer}
.btn-g{background:var(--green);color:#fff}.btn-g:active{background:var(--green-deep)}
.btn-w{background:var(--white);border:1px solid var(--border);color:var(--ink)}.btn-w:active{background:var(--mint-2)}
.btn:disabled{opacity:.4;pointer-events:none}

.sound-btn{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(14,159,110,.3);cursor:pointer;z-index:20;border:none;transition:transform .15s}
.sound-btn:active{transform:scale(.9)}
.sound-btn.off{background:var(--muted)}

.progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .2s}
.dot.done{background:var(--green)}
.dot.current{background:var(--green-deep);box-shadow:0 0 0 3px rgba(14,159,110,.25)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.overlay-card{background:var(--white);border-radius:var(--radius);padding:32px 24px;text-align:center;max-width:340px;width:90%;animation:pop .3s ease}
.overlay-card .emoji{font-size:52px;margin-bottom:12px}
.overlay-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.overlay-card p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">&larr;</a>
    <h1>Al-Ixlos</h1>
  </div>

  <main>
    <div class="surah-header">
      <div class="arabic">الإخلاص</div>
      <div class="name">Al-Ixlos surasi</div>
      <div class="num">112-oyat</div>
    </div>

    <div class="progress" id="progress"></div>

    <div class="ayah-box">
      <div class="label">Oyat matni</div>
      <div class="text" id="ayahText"></div>
    </div>

    <div class="fb" id="fb"></div>

    <div class="slot-area">
      <div class="label">Harflarni shu yerga bosing</div>
      <div class="slots" id="slots"></div>
    </div>

    <div class="pool-area">
      <div class="label">Oyat harflarini bosing — joylanadi</div>
      <div class="pool" id="pool"></div>
    </div>

    <div class="ctrls">
      <button class="btn btn-w" id="resetBtn">Qayta</button>
      <button class="btn btn-g" id="nextBtn" disabled>Keyingi oyat</button>
    </div>
  </main>

  <button class="sound-btn" id="soundBtn">🔊</button>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="emoji">🎉</div>
      <h2>Tabriklaymiz!</h2>
      <p>Siz Al-Ixlos surasini<br>mukammal o'rgandingiz!</p>
      <button class="btn btn-g" id="overlayCloseBtn" style="width:100%">Yaxshi!</button>
    </div>
  </div>
</div>

<script>
(function(){
  var AYAHS = [
    { text: "\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C",
      letters: ["\u0642","\u0644"," ","\u0647","\u0648"," ","\u0627","\u0644","\u0644","\u0647"," ","\u0623","\u062D","\u062F"] },
    { text: "\u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0627\u0644\u0652\u0635\u0650\u064E\u0645\u064E\u062F\u064F",
      letters: ["\u0627","\u0644","\u0644","\u0647"," ","\u0627","\u0644","\u0635","\u0645","\u062F"] },
    { text: "\u0644\u064E\u0645\u0652 \u064A\u064E\u0644\u0650\u062F\u0652 \u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064F\u0648\u064E\u0644\u064E\u062F\u0652",
      letters: ["\u0644","\u0645"," ","\u064A","\u0644","\u062F"," ","\u0648","\u0644","\u0645"," ","\u064A","\u0648","\u0644","\u062F"] },
    { text: "\u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064E\u0643\u064F\u0646\u0652 \u0644\u0651\u064E\u0647\u064F \u0643\u064F\u0641\u064F\u0648\u064E\u064B \u0623\u064E\u062D\u064E\u062F\u064C",
      letters: ["\u0648","\u0644","\u0645"," ","\u064A","\u0643","\u0646"," ","\u0644","\u0647"," ","\u0643","\u0641","\u0648","\u0647"," ","\u0623","\u062D","\u062F"] }
  ];

  var ayahIdx = 0;
  var placed = [];
  var soundOn = true;
  var synth = window.speechSynthesis || null;

  var slotsEl = document.getElementById('slots');
  var poolEl = document.getElementById('pool');
  var fbEl = document.getElementById('fb');
  var ayahTextEl = document.getElementById('ayahText');
  var progressEl = document.getElementById('progress');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');
  var soundBtn = document.getElementById('soundBtn');
  var overlayEl = document.getElementById('overlay');
  var overlayCloseBtn = document.getElementById('overlayCloseBtn');

  function speak(txt) {
    if (!soundOn || !synth || !txt || !txt.trim()) return;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ar-SA';
      u.rate = 0.7;
      u.pitch = 1;
      var voices = synth.getVoices();
      var arVoice = null;
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.indexOf('ar') === 0) {
          arVoice = voices[i];
          break;
        }
      }
      if (arVoice) u.voice = arVoice;
      synth.speak(u);
    } catch(e) {}
  }

  function getClean(ayah) {
    var result = [];
    for (var i = 0; i < ayah.letters.length; i++) {
      if (ayah.letters[i] !== ' ') result.push(ayah.letters[i]);
    }
    return result;
  }

  function renderProgress() {
    var html = '';
    for (var i = 0; i < AYAHS.length; i++) {
      var cls = 'dot';
      if (i < ayahIdx) cls += ' done';
      else if (i === ayahIdx) cls += ' current';
      html += '<div class="' + cls + '"></div>';
    }
    progressEl.innerHTML = html;
  }

  function render() {
    var ayah = AYAHS[ayahIdx];
    var letters = getClean(ayah);
    placed = [];
    for (var i = 0; i < letters.length; i++) placed.push(null);

    ayahTextEl.textContent = ayah.text;
    fbEl.className = 'fb';
    fbEl.textContent = '';
    nextBtn.disabled = true;

    renderProgress();
    renderSlots(letters.length);
    renderPool(ayah.letters);
  }

  function renderSlots(n) {
    slotsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('div');
      s.className = 'slot';
      s.setAttribute('data-i', i);
      s.addEventListener('click', createSlotClick(i));
      slotsEl.appendChild(s);
    }
  }

  function createSlotClick(idx) {
    return function() { removeSlot(idx); };
  }

  function renderPool(letters) {
    poolEl.innerHTML = '';
    var letterIdx = 0;
    for (var i = 0; i < letters.length; i++) {
      if (letters[i] === ' ') {
        var d = document.createElement('div');
        d.className = 'space-dot';
        d.textContent = '\u00B7';
        poolEl.appendChild(d);
        continue;
      }
      var t = document.createElement('div');
      t.className = 'letter';
      t.textContent = letters[i];
      t.setAttribute('data-idx', letterIdx);
      t.setAttribute('data-ch', letters[i]);
      t.addEventListener('click', createPoolClick(t));
      poolEl.appendChild(t);
      letterIdx++;
    }
  }

  function createPoolClick(tile) {
    return function() { placeLetter(tile); };
  }

  function placeLetter(tile) {
    var slots = slotsEl.children;
    var emptySlot = null;
    var emptyIdx = -1;
    for (var i = 0; i < slots.length; i++) {
      if (!slots[i].classList.contains('filled')) {
        emptySlot = slots[i];
        emptyIdx = i;
        break;
      }
    }
    if (!emptySlot) return;

    var ch = tile.getAttribute('data-ch');
    placed[emptyIdx] = ch;

    emptySlot.innerHTML = ch + '<span class="slot-x">\u2715</span>';
    emptySlot.classList.add('filled');
    tile.classList.add('used');

    slotsEl.classList.add('flash');
    setTimeout(function() { slotsEl.classList.remove('flash'); }, 250);

    speak(ch);

    var filledCount = 0;
    for (var j = 0; j < placed.length; j++) {
      if (placed[j]) filledCount++;
    }

    if (filledCount > 1) {
      setTimeout(function() {
        var lastFilled = [];
        for (var k = placed.length - 1; k >= 0; k--) {
          if (placed[k]) {
            lastFilled.unshift(placed[k]);
            if (lastFilled.length >= 3) break;
          }
        }
        speak(lastFilled.join(''));
      }, 700);
    }

    var ayah = AYAHS[ayahIdx];
    var totalLetters = getClean(ayah).length;
    if (filledCount === totalLetters) {
      setTimeout(checkAnswer, 400);
    }
  }

  function removeSlot(idx) {
    if (!placed[idx]) return;
    var ch = placed[idx];
    placed[idx] = null;

    var slots = slotsEl.children;
    slots[idx].innerHTML = '';
    slots[idx].classList.remove('filled', 'ok', 'err');

    var tiles = poolEl.children;
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].classList.contains('letter') &&
          tiles[i].getAttribute('data-ch') === ch &&
          tiles[i].classList.contains('used')) {
        tiles[i].classList.remove('used');
        break;
      }
    }
  }

  function checkAnswer() {
    var ayah = AYAHS[ayahIdx];
    var correct = getClean(ayah);
    var slots = slotsEl.children;
    var allOk = true;

    for (var i = 0; i < correct.length; i++) {
      if (placed[i] === correct[i]) {
        slots[i].classList.add('ok');
      } else {
        slots[i].classList.add('err');
        allOk = false;
      }
    }

    if (allOk) {
      fbEl.className = 'fb ok';
      fbEl.textContent = 'Mukammal! To\'g\'ri!';
      nextBtn.disabled = false;
      speak(ayah.text);
    } else {
      fbEl.className = 'fb no';
      fbEl.textContent = 'Xato bor — qaytadan urinib ko\'ring!';
    }
  }

  function reset() { render(); }

  function nextAyah() {
    if (ayahIdx < AYAHS.length - 1) {
      ayahIdx++;
      render();
    } else {
      overlayEl.classList.add('show');
    }
  }

  function closeOverlay() {
    overlayEl.classList.remove('show');
    ayahIdx = 0;
    render();
  }

  resetBtn.addEventListener('click', reset);
  nextBtn.addEventListener('click', nextAyah);
  soundBtn.addEventListener('click', function() {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '\uD83D\uDD0A' : '\uD83D\uDD07';
    soundBtn.classList.toggle('off', !soundOn);
  });
  overlayCloseBtn.addEventListener('click', closeOverlay);

  if (synth) {
    synth.onvoiceschanged = function() { synth.getVoices(); };
  }

  render();
})();
</script>
</body>
</html>
