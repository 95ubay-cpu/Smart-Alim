<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universitetlar — Smart Ta'lim</title>
<link rel="stylesheet" href="style.css">
<style>
  .uni-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  .uni-modal-overlay.open { display: flex; }
  .uni-modal-box {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .uni-modal-box h2 {
    margin: 0 0 4px 0;
    font-size: 18px;
  }
  .uni-modal-sub {
    color: #666;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .uni-modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #888;
  }
  .uni-modal-section-title {
    font-weight: 600;
    font-size: 14px;
    margin: 14px 0 6px 0;
  }
  .uni-modal-fac-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .uni-modal-fac-list li {
    padding: 8px 10px;
    background: #f2f8f2;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .uni-modal-empty {
    color: #999;
    font-size: 13px;
    font-style: italic;
    padding: 8px 0;
  }
  .item-card { cursor: pointer; }

  .uni-card{ flex-direction:column; align-items:stretch; }
  .uni-photo{
    width:100%; height:150px;
    border-radius:10px;
    overflow:hidden;
    background:#e9f5ef;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
    flex-shrink:0;
  }
  .uni-photo img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .uni-photo.no-photo{ font-size:36px; }
  .uni-info{
    margin:8px 0 0;
    font-size:13px; color:#5B6B65; line-height:1.55;
  }

  .uni-modal-photo{
    margin:-20px -20px 14px;
    height:160px;
    border-radius:16px 16px 0 0;
    overflow:hidden;
    background:#e9f5ef;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
  }
  .uni-modal-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .uni-modal-info{
    font-size:13.5px; color:#444; line-height:1.6;
    margin:10px 0 4px;
  }
</style>
</head>

    { name: "Sharq xalqaro universiteti", city: "Toshkent", type: "Xususiy", faculties: [] }
  ];

  function renderUniversities(list) {
    const grid = document.getElementById("uni-list");
    grid.innerHTML = "";
    list.forEach((u) => {
      const card = document.createElement("div");
      card.className = "item-card uni-card";
      const photo = u.img
        ? `<div class="uni-photo"><img src="${u.img}" alt="${u.name}" loading="lazy"></div>`
        : `<div class="uni-photo no-photo">🏛️</div>`;
      card.innerHTML = `
        ${photo}
        <div class="meta">
          <p class="title">${u.name}</p>
          <p class="sub">O'zbekiston · ${u.city}</p>
          <span class="tag">${u.type}</span>
          ${u.info ? `<p class="uni-info">${u.info}</p>` : ""}
        </div>
      `;
      card.addEventListener("click", () => openUniModal(u));
      grid.appendChild(card);
    });
  }

  function openUniModal(u) {
    document.getElementById("uniModalTitle").textContent = u.name;
    document.getElementById("uniModalSub").textContent = `${u.type} · ${u.city}`;
    const photoEl = document.getElementById("uniModalPhoto");
    if (u.img) {
      photoEl.innerHTML = `<img src="${u.img}" alt="${u.name}">`;
    } else {
      photoEl.innerHTML = "🏛️";
    }
    const infoEl = document.getElementById("uniModalInfo");
    infoEl.textContent = u.info || "";
    infoEl.style.display = u.info ? "block" : "none";
    const list = document.getElementById("uniModalFacList");
    list.innerHTML = "";
    if (u.faculties && u.faculties.length > 0) {
      u.faculties.forEach(f => {
        const li = document.createElement("li");
        li.textContent = f;
        list.appendChild(li);
      });
    } else {
      list.innerHTML = '<p class="uni-modal-empty">Fakultetlar ro\'yxati tez orada qo\'shiladi</p>';
    }
    document.getElementById("uniModal").classList.add("open");
  }

  document.getElementById("uniModalClose").addEventListener("click", () => {
    document.getElementById("uniModal").classList.remove("open");
  });
  document.getElementById("uniModal").addEventListener("click", (e) => {
    if (e.target.id === "uniModal") {
      document.getElementById("uniModal").classList.remove("open");
    }
  });

  renderUniversities(universities);

  document.getElementById("uni-search").addEventListener("input", function (e) {
    const q = e.target.value.toLowerCase();
    const filtered = universities.filter(u =>
      u.name.toLowerCase().includes(q) || u.city.toLowerCase().includes(q)
    );
    renderUniversities(filtered);
  });
</script>

</body>
</html>
