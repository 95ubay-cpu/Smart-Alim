<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<script src="auth-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Ta'lim — Bosh sahifa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="corner-actions">
    <a class="corner-btn" href="royxatdan-otish.html" title="Ro'yxatdan o'tish">📝</a>
    <a class="corner-btn" href="chat.html" title="Chat">💬</a>
    <a class="corner-btn" href="profil.html" title="Profil">👤</a>
  </div>

  <main>
    <div class="logo-header">
      <img src="talim.jpg" alt="Smart Ta'lim" class="logo-large">
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Qidiruv: boʻlim nomi...">
    </div>

    <div class="section-title">Boʻlimlar</div>
    <div class="folder-grid">

      <a class="folder-card" href="lugat.html">
        <div class="icon">🔤</div>
        <div>
          <div class="folder-name">Lugʻat</div>
          <div class="folder-count">Ingliz ↔ Oʻzbek</div>
        </div>
      </a>

      <a class="folder-card" href="hangul.html">
        <div class="icon">🇰🇷</div>
        <div>
          <div class="folder-name">Koreys yozuvi</div>
          <div class="folder-count">Hangul harflarini o'rganing</div>
        </div>
      </a>

      <a class="folder-card" href="arab.html">
        <div class="icon">🕌</div>
        <div>
          <div class="folder-name">Arab yozuvi</div>
          <div class="folder-count">Arab harflarini o'rganing</div>
        </div>
      </a>

      <a class="folder-card" href="english.html">
        <div class="icon">🇬🇧</div>
        <div>
          <div class="folder-name">Ingliz tili</div>
          <div class="folder-count">So'z yig'ish bilan o'rganing</div>
        </div>
      </a>

      <a class="folder-card" href="nemis.html">
        <div class="icon">🇩🇪</div>
        <div>
          <div class="folder-name">Nemis tili</div>
          <div class="folder-count">So'z yig'ish bilan o'rganing</div>
        </div>
      </a>

      <a class="folder-card" href="fransuz.html">
        <div class="icon">🇫🇷</div>
        <div>
          <div class="folder-name">Fransuz tili</div>
          <div class="folder-count">So'z yig'ish bilan o'rganing</div>
        </div>
      </a>

    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html"><span class="ic">🏠</span>Bosh sahifa</a>
    <a class="nav-item" href="lugat.html"><span class="ic">🔤</span>Lugʻat</a>
  </nav>

</div>
<script src="script.js"></script>
<script>
  const searchInput = document.getElementById('search-input');
  const cards = document.querySelectorAll('.folder-card');
  const searchHint = document.createElement('div');
  searchHint.className = 'empty';
  searchHint.style.cssText = 'display:none;text-align:center;color:#6b7a73;padding:24px 0;';
  searchHint.innerHTML = '<div class="ic">🔍</div><p>Hech narsa topilmadi. Boshqa soʻz bilan izlab koʻring.</p>';

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    let found = 0;
    cards.forEach(card => {
      const text = card.textContent.toLowerCase();
      const show = !q || text.includes(q);
      card.style.display = show ? '' : 'none';
      if (show) found++;
    });
    searchHint.style.display = found === 0 ? 'block' : 'none';
    document.querySelector('.folder-grid').appendChild(searchHint);
  });
</script>
</body>
</html>
