<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roʻyxatdan oʻtish — Smart Ta'lim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back" href="index.html">←</a>
    <h1>Roʻyxatdan oʻtish</h1>
  </div>

  <main>
    <div class="auth-hero">
      <img src="talim.jpg" alt="Smart Ta'lim">
      <h2>Hisob yarating</h2>
      <p>Kitoblar, universitetlar va koʻp narsaga kirish uchun roʻyxatdan oʻting</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-name">Ism</label>
        <input class="form-input" type="text" id="reg-name" placeholder="Ismingiz" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input class="form-input" type="email" id="reg-email" placeholder="email@misol.uz" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="reg-pass">Parol</label>
        <input class="form-input" type="password" id="reg-pass" placeholder="Kamida 6 belgi" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="reg-pass2">Parolni tasdiqlang</label>
        <input class="form-input" type="password" id="reg-pass2" placeholder="Parolni qayta kiriting" autocomplete="new-password">
      </div>
      <div class="form-error" id="register-error"></div>
      <button class="btn-primary" type="submit">Roʻyxatdan oʻtish</button>
    </form>

    <div style="text-align:center;margin:12px 0;">yoki</div>
    <div style="display:flex;justify-content:center;gap:10px;margin-bottom:8px;">
      <button id="google-signup" class="btn-outline">Google bilan</button>
    </div>

    <div class="auth-switch">
      Hisobingiz bormi? <a href="kirish.html">Kirish</a>
    </div>
  </main>

</div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://sjkygpcdwfmdafceamnn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_BtIqBdd9iLiCtG04b5tTjQ_Mv8Ozrjx';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('register-form');
  const errBox = document.getElementById('register-error');
  const googleBtn = document.getElementById('google-signup');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    errBox.textContent = '';
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;

    if(!name || !email || !pass){ errBox.textContent = 'Barcha maydonlarni toʻldiring.'; return; }
    if(pass.length < 6){ errBox.textContent = 'Parol kamida 6 belgidan iborat boʻlishi kerak.'; return; }
    if(pass !== pass2){ errBox.textContent = 'Parollar mos kelmadi.'; return; }

    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: pass,
      options: { data: { full_name: name } }
    });

    if(error){ errBox.textContent = error.message; return; }

    // Supabase sends confirmation email if configured. Redirect to profil.
    window.location.href = 'profil.html';
  });

  googleBtn.addEventListener('click', async ()=>{
    await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/pages/profil.html' } });
  });
</script>
</body>
</html>
