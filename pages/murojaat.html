<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murojaat yuborish — Smart Ta'lim</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --main-green:#1fa363;
    --light-green:#e8f8f0;
    --dark-text:#1c2b25;
    --gray-text:#6b7a73;
    --border:#dfece6;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
  body{background:var(--light-green);color:var(--dark-text);padding-bottom:40px;}

  .topbar{
    background:var(--main-green);color:var(--white);
    padding:16px 18px;box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .topbar h1{font-size:20px;font-weight:600;}

  .mode-tabs{display:flex;gap:8px;padding:14px 16px 0;max-width:480px;margin:0 auto;}
  .mode-btn{
    flex:1;padding:12px 8px;border:1px solid var(--border);border-radius:10px;
    background:var(--white);color:var(--dark-text);font-size:12.5px;font-weight:600;
    cursor:pointer;text-align:center;line-height:1.3;
  }
  .mode-btn.active{background:var(--main-green);color:var(--white);border-color:var(--main-green);}

  .form-wrap{padding:16px;max-width:480px;margin:0 auto;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--border);
    border-radius:10px;font-size:14px;background:var(--white);color:var(--dark-text);outline:none;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus, .field textarea:focus{border-color:var(--main-green);}

  .file-label{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:2px dashed var(--border);border-radius:10px;padding:16px;
    background:var(--white);cursor:pointer;font-size:13px;color:var(--gray-text);
  }
  .file-label.has-file{border-color:var(--main-green);color:var(--main-green);}
  input[type=file]{display:none;}

  .submit-btn{
    width:100%;padding:13px;border:none;border-radius:10px;
    background:var(--main-green);color:var(--white);font-size:15px;font-weight:600;
    cursor:pointer;margin-top:6px;
  }
  .submit-btn:disabled{opacity:.6;}

  .status{
    margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;text-align:center;display:none;
  }
  .status.ok{display:block;background:#e6f7ec;color:#187a45;}
  .status.err{display:block;background:#fdecec;color:#c0392b;}

  .info-note{
    font-size:12px;color:var(--gray-text);padding:10px 2px;line-height:1.5;
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="../index.html">←</a>
  <h1>✉️ Murojaat yuborish</h1>
</div>

<div class="mode-tabs">
  <button class="mode-btn active" data-mode="bizga" id="tabBizga">
    📩 Hujjatlarimizni to'g'ridan-to'g'ri sizga yuboraman
  </button>
  <button class="mode-btn" data-mode="universitetga" id="tabUniv">
    🎓 Universitetga murojaat yo'llash
  </button>
</div>

<div class="form-wrap">
  <p class="info-note" id="modeNote">
    Hujjatlaringizni bizga yuboring — biz ko'rib chiqib, sizga qaysi universitet mos kelishi bo'yicha maslahat beramiz.
  </p>

  <form id="murojaatForm">
    <div class="field">
      <label>F.I.Sh</label>
      <input type="text" id="fullname" required placeholder="Ismingiz Familiyangiz">
    </div>

    <div class="field">
      <label>Telefon raqam</label>
      <input type="tel" id="phone" required placeholder="+998 90 123 45 67">
    </div>

    <div class="field">
      <label>Qaysi universitet bo'yicha?</label>
      <input type="text" id="university" required placeholder="Universitet nomi (yoki 'Aniqlanmagan')">
    </div>

    <div class="field">
      <label>Xabar / Savolingiz</label>
      <textarea id="message" placeholder="Nima haqida murojaat qilyapsiz?"></textarea>
    </div>

    <div class="field">
      <label>Hujjat biriktirish (ixtiyoriy)</label>
      <label class="file-label" id="fileLabel" for="fileInput">
        📎 Fayl tanlash (PDF, rasm)
      </label>
      <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Yuborish</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script>
// ====== SHU IKKI QATORNI SUPABASE'DAGI O'ZINGIZNIKI BILAN ALMASHTIRING ======
const SUPABASE_URL = "https://itcqrocfpwrdgnkdxgak.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0Y3Fyb2NmcHdyZGdua2R4Z2FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzM0NDAsImV4cCI6MjEwMTQwOTQ0MH0.FiUJgDRF1VwztO4aKA7ZKzTZzSCAu0L3NnHROUt4ab4";
// ==============================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentMode = "bizga";
const notes = {
  bizga: "Hujjatlaringizni bizga yuboring — biz ko'rib chiqib, sizga qaysi universitet mos kelishi bo'yicha maslahat beramiz.",
  universitetga: "Bu murojaatingiz belgilangan universitetga yo'naltiriladi (universitet bilan hamkorlik o'rnatilgan bo'limlar uchun)."
};

document.getElementById("tabBizga").addEventListener("click", () => setMode("bizga"));
document.getElementById("tabUniv").addEventListener("click", () => setMode("universitetga"));

function setMode(mode){
  currentMode = mode;
  document.getElementById("tabBizga").classList.toggle("active", mode==="bizga");
  document.getElementById("tabUniv").classList.toggle("active", mode==="universitetga");
  document.getElementById("modeNote").textContent = notes[mode];
}

const form = document.getElementById("murojaatForm");
const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("statusBox");

fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0){
    fileLabel.textContent = "✅ " + fileInput.files[0].name;
    fileLabel.classList.add("has-file");
  } else {
    fileLabel.textContent = "📎 Fayl tanlash (PDF, rasm)";
    fileLabel.classList.remove("has-file");
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (SUPABASE_URL.includes("SIZNING-PROJECT")){
    showStatus("Baza sozlanmagan. Kod ichidagi SUPABASE_URL va SUPABASE_ANON_KEY ni to'ldiring.", false);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Yuborilmoqda...";

  const fullname = document.getElementById("fullname").value;
  const phone = document.getElementById("phone").value;
  const university = document.getElementById("university").value;
  const message = document.getElementById("message").value || null;

  try {
    let fileUrl = null;

    if (fileInput.files.length > 0){
      const file = fileInput.files[0];
      const filePath = `${Date.now()}_${file.name}`;

      const { error: uploadError } = await supabase.storage
        .from("hujjatlar")
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      const { data: urlData } = supabase.storage
        .from("hujjatlar")
        .getPublicUrl(filePath);

      fileUrl = urlData.publicUrl;
    }

    const { error: insertError } = await supabase
      .from("murojaatlar")
      .insert([{
        fullname, phone, university, message,
        file_url: fileUrl,
        turi: currentMode
      }]);

    if (insertError) throw insertError;

    showStatus("✅ Murojaatingiz yuborildi! Tez orada bog'lanamiz.", true);
    form.reset();
    fileLabel.textContent = "📎 Fayl tanlash (PDF, rasm)";
    fileLabel.classList.remove("has-file");

  } catch (err){
    console.error(err);
    showStatus("❌ Xatolik yuz berdi. Qaytadan urinib ko'ring.", false);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Yuborish";
  }
});

function showStatus(text, ok){
  statusBox.textContent = text;
  statusBox.className = "status " + (ok ? "ok" : "err");
}
</script>
</body>
</html>
